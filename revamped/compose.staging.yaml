# Dedicated server deployment. Uses GHCR images and isolated project-scoped volumes.
name: bayu-platform-staging
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bayu
      POSTGRES_USER: bayu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U bayu -d bayu
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory-policy
    - noeviction
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-minio:${TAG:?TAG is required}
  optimizer:
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-optimizer:${TAG:?TAG is required}
  api:
    environment:
      DATABASE_URL: postgres://bayu:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bayu?sslmode=disable
      REDIS_ADDR: redis:6379
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: imports
      OPTIMIZER_URL: http://optimizer:8000
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:8080/health
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-backend:${TAG:?TAG is required}
    ports:
    - ${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8090}:8080
  worker:
    command:
    - worker
    environment:
      DATABASE_URL: postgres://bayu:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bayu?sslmode=disable
      REDIS_ADDR: redis:6379
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: imports
      OPTIMIZER_URL: http://optimizer:8000
    depends_on:
      api:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    stop_grace_period: 100s
    restart: unless-stopped
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-backend:${TAG:?TAG is required}
  frontend:
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?NUXT_PUBLIC_API_BASE is required}
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-frontend:${TAG:?TAG is required}
    ports:
    - ${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3010}:3000
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data: null
  redis-data: null
  minio-data: null
