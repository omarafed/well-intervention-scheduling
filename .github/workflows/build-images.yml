name: Build & Deploy Platform Images

# stag-* -> staging, using the same DEPLOY_* secrets as edafy-asset.
on:
  push:
    tags: ['stag-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bayu-platform-staging
  cancel-in-progress: false

jobs:
  setup:
    name: Validate staging configuration
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image_prefix: ${{ steps.release.outputs.image_prefix }}
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - name: Resolve release
        id: release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::$key must be configured in this repository's staging environment"
              exit 1
            fi
          done
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="stag-manual-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            if [[ ! "$GITHUB_REF_NAME" =~ ^stag-[A-Za-z0-9_.-]+$ ]] || [ "${#GITHUB_REF_NAME}" -gt 80 ]; then
              echo '::error::Use a stag-* tag containing letters, numbers, dots, underscores or hyphens (maximum 80 characters).'
              exit 1
            fi
            tag="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "image_prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

  check:
    name: Backend and optimizer checks
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: revamped/backend/go.mod
          cache-dependency-path: revamped/backend/go.sum
      - name: Test Go backend
        working-directory: revamped/backend
        run: |
          go test ./...
          go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: revamped/optimizer/requirements.txt
      - name: Test optimizer
        working-directory: revamped/optimizer
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Test deployment script
        run: |
          bash -n revamped/deploy/staging.sh
          python -m unittest discover -s revamped/deploy -v
      - name: Validate staging Compose
        env:
          IMAGE_PREFIX: ghcr.io/example/bayu
          TAG: stag-check
          POSTGRES_PASSWORD: ci-test-db
          SERVICE_TOKEN: ci-test-service
          MINIO_ROOT_USER: ci-test
          MINIO_ROOT_PASSWORD: ci-test-storage
          CORS_ORIGINS: http://localhost:3010
          NUXT_PUBLIC_API_BASE: http://localhost:8090/api
        run: docker compose -f revamped/compose.staging.yaml config --quiet

  build:
    name: Build ${{ matrix.component }}
    needs: [setup, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, optimizer, minio]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./revamped/${{ matrix.component }}
          file: ./revamped/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.setup.outputs.image_prefix }}-${{ matrix.component }}:${{ needs.setup.outputs.image_tag }}
          cache-from: type=gha,scope=platform-${{ matrix.component }}
          cache-to: type=gha,scope=platform-${{ matrix.component }},mode=max

  deploy:
    name: Deploy staging
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          source: revamped/compose.staging.yaml,revamped/deploy/staging.sh
          target: /tmp/bayu-platform-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_PREFIX: ${{ needs.setup.outputs.image_prefix }}
          DEPLOY_TAG: ${{ needs.setup.outputs.image_tag }}
          TARGET_HOST: ${{ secrets.DEPLOY_HOST }}
          RELEASE_FILES: /tmp/bayu-platform-${{ github.run_id }}-${{ github.run_attempt }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          APP_PORT: ${{ vars.APP_PORT || '3010' }}
          API_PORT: ${{ vars.API_PORT || '8090' }}
          BIND_ADDRESS: ${{ vars.BIND_ADDRESS || '0.0.0.0' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_PREFIX,DEPLOY_TAG,TARGET_HOST,RELEASE_FILES,PUBLIC_APP_URL,PUBLIC_API_BASE,APP_PORT,API_PORT,BIND_ADDRESS
          command_timeout: 20m
          script: |
            bash "$RELEASE_FILES/revamped/deploy/staging.sh"
